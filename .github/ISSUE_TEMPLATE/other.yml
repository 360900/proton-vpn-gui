name: Other
description: Questions, documentation issues, build problems, packaging issues, or anything else.
labels: ["question"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: >
            I have **searched existing issues** and confirmed this is not a duplicate.
          required: true
  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      description: Select the category that best describes your issue.
      options:
        - Question
        - Documentation
        - Build / Compilation Issue
        - Packaging Issue
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe your question or issue in as much detail as possible.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: >
        Any extra information that might be helpful — OS, package manager, relevant terminal output,
        links, etc.
    validations:
      required: false
