name: Feature Request
description: Suggest a new feature or enhancement for proton-vpn-qt-app.
labels: ["enhancement"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checklist
      options:
        - label: >
            I have **searched for duplicate feature requests** and have not found an existing one for this idea.
          required: true
        - label: >
            I understand that **this app can only expose features supported by the public `protonvpn` CLI**.
            Requests that require access to Proton AG's internal APIs cannot be implemented.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: >
        What problem does this feature solve, or what workflow would it improve?
        A clear description of *why* you want this helps evaluate the request.
      placeholder: "I find it frustrating when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you would like. Be as specific as possible.
      placeholder: "I would like the app to ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: >
        Have you considered any alternative approaches or workarounds? If so, why do you prefer your
        proposed solution?
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: >
        Any other context, screenshots, mockups, or links that would help illustrate the request.
        Drag-and-drop images directly into this field.
    validations:
      required: false
