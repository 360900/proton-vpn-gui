app-id: io.github._360900.ProtonVpnGui
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: proton_vpn_gui
finish-args:
  # Display
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Network access (ProtonVPN account/status queries, update checks)
  - --share=network
  # Required for flatpak-spawn --host: every VPN action is delegated to the
  # protonvpn CLI installed on the host system.
  - --talk-name=org.freedesktop.Flatpak
  # System tray icon (StatusNotifierItem)
  - --talk-name=org.kde.StatusNotifierWatcher
  # Desktop notifications for connect/disconnect events
  - --talk-name=org.freedesktop.Notifications
  # The D-Bus service the app publishes on the session bus uses the app-id as
  # its name (io.github._360900.ProtonVpnGui), so ownership is granted
  # automatically and no --own-name is needed here.
  # Read-only access to the settings file written by the host protonvpn CLI.
  # Without this, fetchSettings() cannot read ~/.config/Proton/VPN/settings.json
  # and all VPN settings toggles will appear as OFF.
  - --filesystem=xdg-config/Proton:ro
  # Allow writing the XDG autostart .desktop file for the "Launch on Startup" feature.
  - --filesystem=xdg-config/autostart

modules:
  - name: proton_vpn_gui
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    subdir: src
    post-install:
      # Rename the icon to match the Flatpak app-id so the launcher can find it
      - mv /app/share/icons/hicolor/scalable/apps/proton-vpn-gui.svg
          /app/share/icons/hicolor/scalable/apps/io.github._360900.ProtonVpnGui.svg
      # Patch the Icon= and Exec= fields in the installed .desktop file
      - sed -i 's/^Icon=.*/Icon=io.github._360900.ProtonVpnGui/'
          /app/share/applications/proton-vpn-gui.desktop
      - sed -i 's/^Exec=.*/Exec=proton_vpn_gui/'
          /app/share/applications/proton-vpn-gui.desktop
      # Rename the .desktop file itself to the app-id (required by Flatpak)
      - mv /app/share/applications/proton-vpn-gui.desktop
          /app/share/applications/io.github._360900.ProtonVpnGui.desktop

    sources:
      - type: git
        url: https://github.com/360900/proton-vpn-gui.git
        tag: v2.0.0
        commit: 6ab71f8e400834a81baa3d9b6fa03b6f1303e84d
        # Flathub requires both the release tag and its full commit.
        x-checker-data:
          type: git
          tag-pattern: ^v(\d+\.\d+\.\d+)$
